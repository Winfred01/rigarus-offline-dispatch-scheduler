[package]
name = "rigarus-dispatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "2", features = [] }
