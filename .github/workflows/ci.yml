name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Restore, build and test
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Scan tracked paths and secrets
        run: ./scripts/Test-RepositoryPrivacy.ps1
      - name: Test offline acceptance wait and failure handling
        shell: powershell
        run: ./scripts/Test-TauriAcceptanceHarness.ps1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Rigarus.sln --locked-mode
      - run: dotnet format whitespace Rigarus.sln --verify-no-changes --no-restore
      - run: dotnet build Rigarus.sln -c Release --no-restore
      - run: dotnet test Rigarus.sln -c Release --no-build --no-restore

  backend:
    name: Check the Python backend
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Rigarus.Backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.10.12
      - run: uv sync --locked --group bundle
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked python -m unittest discover -s tests -v
      - name: Build the Windows Python sidecar
        working-directory: .
        run: ./scripts/Build-RigarusSidecar.ps1
      - name: Test the packaged sidecar on loopback
        run: |
          $env:RIGARUS_SIDECAR_TEST_EXE = (Resolve-Path '../../artifacts/sidecar/Rigarus.Sidecar/Rigarus.Sidecar.exe').Path
          uv run --locked python -m unittest discover -s tests -p test_sidecar.py -v

  tauri:
    name: Build the Tauri desktop
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/Rigarus.Tauri
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Rigarus.Tauri/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare the Python sidecar
        working-directory: .
        run: |
          python -m pip install uv==0.10.12
          ./scripts/Build-RigarusSidecar.ps1
      - run: npm ci
      - run: npm run format
      - run: npm test
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - run: cargo +1.95.0 fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo +1.95.0 fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Build the installer
        env:
          RUSTUP_TOOLCHAIN: '1.95.0'
        run: npm run tauri -- build -- --locked
      - name: Test sidecar readiness and startup errors
        run: cargo +1.95.0 test --release --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Assemble the offline acceptance kit
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          $installer = @(Get-ChildItem -LiteralPath 'src/Rigarus.Tauri/src-tauri/target/release/bundle/nsis' -Filter '*_x64-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one x64 installer.' }
          ./scripts/New-TauriAcceptanceKit.ps1 -Installer $installer[0].FullName -Commit $env:GITHUB_SHA -OutputDirectory artifacts/offline-acceptance
      - name: Save the private offline acceptance kit
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: rigarus-windows-x64-offline-acceptance
          path: artifacts/offline-acceptance/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
