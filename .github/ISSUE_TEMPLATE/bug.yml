name: Bug
description: Report a reproducible problem with synthetic evidence
body:
  - type: textarea
    id: environment
    attributes:
      label: Build and Windows version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior and observed behavior
      description: Use synthetic data and redact diagnostics.
    validations:
      required: true
